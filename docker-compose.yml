# Pile de développement locale d'UNE instance My Job Community (un client).
#
#   mariadb  → base de Strapi
#   strapi   → back-office + API         http://localhost:1337/admin
#   site     → Astro en mode dev         http://localhost:4321
#   builder  → reçoit le webhook Strapi et régénère le site statique
#   web      → Nginx qui sert le site statique généré   http://localhost:8080
#   mailpit  → boîte mail de test (inscriptions aux événements)  http://localhost:8026

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USERNAME}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  strapi:
    build: ./cms
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_CLIENT: mysql
      DATABASE_HOST: mariadb
      DATABASE_PORT: 3306
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      BUILDER_WEBHOOK_URL: http://builder:4000/build
      # Adresse du site vue depuis Strapi (vérifications de l'espace « Site Gestmax »)
      SITE_INTERNAL_URL: http://web
      # Les fichiers viennent d'un montage Windows : pas d'événements inotify.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "1337:1337"
    volumes:
      - ./cms:/opt/app
      - /opt/app/node_modules
    depends_on:
      mariadb:
        condition: service_healthy

  site:
    build: ./site
    restart: unless-stopped
    env_file: .env
    environment:
      STRAPI_URL: http://strapi:1337
      WATCH_POLLING: "true"
      ASTRO_TELEMETRY_DISABLED: "1"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "4321:4321"
    volumes:
      - ./site:/app
      - /app/node_modules
    depends_on:
      - strapi

  builder:
    build:
      context: .
      dockerfile: builder/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      STRAPI_URL: http://strapi:1337
      SITE_DIR: /app
      RELEASES_DIR: /srv/site
      ASTRO_TELEMETRY_DISABLED: "1"
      # Gros volumes d'offres (dizaines de milliers de pages) : plus de mémoire pour la génération du site.
      NODE_OPTIONS: --max-old-space-size=4096
    volumes:
      - ./site:/app
      - /app/node_modules
      - site_releases:/srv/site
    depends_on:
      - strapi

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      HEADER_FOOTER_TOKEN: ${HEADER_FOOTER_TOKEN}
    ports:
      - "8080:80"
    volumes:
      - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - site_releases:/srv/site:ro

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8026:8025"

volumes:
  mariadb_data:
  site_releases:
